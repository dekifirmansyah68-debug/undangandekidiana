<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deki & Diana — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{background:#050505;color:#f5dfaa;font-family:Montserrat,sans-serif;overflow:hidden}
.cover{position:relative;width:100%;height:100vh;min-height:650px;overflow:hidden;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at center,rgba(120,82,22,.12),transparent 45%),linear-gradient(135deg,#020202,#11100d,#030303)}
.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,205,100,.08),transparent 2%),radial-gradient(circle at 80% 70%,rgba(255,205,100,.07),transparent 2%),radial-gradient(circle at 50% 20%,rgba(255,205,100,.05),transparent 3%);opacity:.8}
.frame{position:absolute;inset:18px;border:1px solid rgba(216,168,74,.7);box-shadow:inset 0 0 25px rgba(212,161,65,.05),0 0 20px rgba(212,161,65,.08);pointer-events:none}
.frame:before{content:"";position:absolute;inset:7px;border:1px solid rgba(212,161,65,.25)}
.arch{position:absolute;top:-65px;left:50%;transform:translateX(-50%);width:250px;height:230px;border:2px solid rgba(230,185,92,.8);border-bottom:none;border-radius:150px 150px 0 0;box-shadow:0 0 20px rgba(224,174,74,.12)}
.arch:after{content:"";position:absolute;inset:10px;border:1px solid rgba(224,174,74,.35);border-bottom:none;border-radius:140px 140px 0 0}
.content{position:relative;z-index:10;width:min(90%,480px);text-align:center;display:flex;flex-direction:column;align-items:center;animation:fadeUp 1.5s ease forwards}
.small-title{font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:6px;color:#e8ce91;margin-bottom:15px}
.ornament{width:130px;height:1px;background:linear-gradient(90deg,transparent,#d7ad58,transparent);position:relative;margin-bottom:30px}
.ornament:after{content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);color:#e0b65f;font-size:9px;background:#080807;padding:0 8px}
.name{font-family:'Great Vibes',cursive;font-size:clamp(62px,17vw,105px);line-height:.85;font-weight:400;background:linear-gradient(120deg,#9e722d,#fff0b2,#d6a849,#fff2bc,#9d702d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(229,182,80,.25));margin:5px 0}
.degree{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:3px;color:#d8bd7c;margin-top:3px}
.ampersand{font-family:'Cormorant Garamond',serif;font-size:42px;color:#e5c477;margin:13px 0}
.date-line{margin-top:28px;display:flex;align-items:center;gap:15px;color:#e8cf94;font-family:'Cormorant Garamond',serif;font-size:23px;letter-spacing:3px}
.date-line span{width:40px;height:1px;background:linear-gradient(90deg,transparent,#d9ae55)}
.date-line span:last-child{background:linear-gradient(90deg,#d9ae55,transparent)}
.guest{margin-top:22px;font-size:11px;letter-spacing:2px;line-height:1.8;color:rgba(239,219,173,.75)}
.button{position:relative;margin-top:28px;width:230px;height:58px;display:flex;justify-content:center;align-items:center;color:#f5d890;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:4px;border:1px solid #b88a38;background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(130,90,20,.08));box-shadow:inset 0 0 15px rgba(222,171,70,.08),0 0 18px rgba(213,163,60,.12);transition:.4s ease;overflow:hidden}
.button:before,.button:after{content:"";position:absolute;width:10px;height:10px;border:1px solid #e2b95f}
.button:before{top:4px;left:4px;border-right:none;border-bottom:none}
.button:after{right:4px;bottom:4px;border-left:none;border-top:none}
.button:hover{transform:translateY(-3px);background:rgba(204,158,61,.12);box-shadow:0 0 30px rgba(225,176,74,.3)}
.light{position:absolute;width:500px;height:500px;border-radius:50%;border:1px solid rgba(220,170,65,.08);transform:rotate(25deg);animation:rotateLight 15s linear infinite}
.light.one{left:-330px;bottom:-100px}.light.two{right:-330px;top:100px;animation-direction:reverse}
.particles{position:absolute;inset:0;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#e8c46d;box-shadow:0 0 8px #e6bb59;opacity:0;animation:sparkle var(--duration) infinite ease-in-out}
.flower{position:absolute;color:#c9973e;opacity:.65;font-size:95px;line-height:1;filter:drop-shadow(0 0 10px rgba(222,169,67,.12))}
.flower.left{top:-15px;left:-20px;transform:rotate(-20deg)}.flower.right{top:-20px;right:-20px;transform:rotate(20deg)}.flower.bottom-left{bottom:-25px;left:-15px;transform:rotate(25deg)}.flower.bottom-right{bottom:-25px;right:-15px;transform:rotate(-25deg)}
@keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@keyframes sparkle{0%{opacity:0;transform:translateY(20px) scale(.5)}50%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1.2)}}
@keyframes rotateLight{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media(max-width:480px){.frame{inset:12px}.arch{width:210px;height:200px}.small-title{font-size:13px;letter-spacing:4px}.name{font-size:70px}.degree{font-size:12px;letter-spacing:2px}.ampersand{font-size:34px;margin:10px 0}.date-line{font-size:19px;letter-spacing:2px}.button{width:210px;height:54px}.flower{font-size:70px}}
</style>
</head>
<body>
<section class="cover">
<div class="frame"></div><div class="arch"></div>
<div class="flower left">❀</div><div class="flower right">❀</div>
<div class="flower bottom-left">❀</div><div class="flower bottom-right">❀</div>
<div class="light one"></div><div class="light two"></div>
<div class="particles" id="particles"></div>
<div class="content">
<div class="small-title">THE WEDDING OF</div>
<div class="ornament"></div>
<div class="name">Deki</div>
<div class="degree">FIRMANSYAH, S.Pd</div>
<div class="ampersand">&amp;</div>
<div class="name">Diana</div>
<div class="degree">PATMAWATI, S.Pd</div>
<div class="date-line"><span></span>06 SEPTEMBER 2026<span></span></div>
<div class="guest">Kepada Yth.<br>Bapak / Ibu / Saudara / i</div>
<a href="https://indoinvite.com/s/1488832/dindin-desti/?kpd=Diana+Fatmawati" class="button">BUKA UNDANGAN</a>
</div>
</section>
<script>
const container=document.getElementById("particles");
for(let i=0;i<55;i++){
 const p=document.createElement("div");p.classList.add("particle");
 p.style.left=Math.random()*100+"%";p.style.top=Math.random()*100+"%";
 p.style.setProperty("--duration",(3+Math.random()*5)+"s");
 p.style.animationDelay=Math.random()*5+"s";
 const size=1+Math.random()*3;p.style.width=size+"px";p.style.height=size+"px";
 container.appendChild(p);
}
document.querySelector(".button").addEventListener("click",function(){this.innerHTML="MEMBUKA...";});
</script>
</body>
</html>
